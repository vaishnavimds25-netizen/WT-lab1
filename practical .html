<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 APIs Practical - S.B. Jain</title>
    <style>
        /* --- CSS STYLING --- */
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background: #1e293b;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border: 1px solid #334155;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #38bdf8;
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        h1 { font-size: 1.5rem; color: #38bdf8; margin: 0; }
        h3 { color: #94a3b8; font-size: 0.9rem; margin-top: 5px; }

        .api-section {
            background: #0f172a;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #38bdf8;
        }

        h2 { font-size: 1.1rem; margin-top: 0; color: #f8fafc; }

        /* Drag & Drop Visuals */
        .drop-zone {
            height: 80px;
            border: 2px dashed #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            border-radius: 8px;
        }

        #drag-item {
            font-size: 2.5rem;
            cursor: grab;
            transition: transform 0.2s;
        }

        #drag-item:active { transform: scale(1.2); }

        /* Geolocation Visuals */
        .geo-box {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #1e293b;
            padding: 10px;
            border-radius: 5px;
        }

        .dot {
            height: 12px;
            width: 12px;
            background-color: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        /* Web Storage Visuals */
        input {
            width: 70%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
        }

        button {
            padding: 8px 12px;
            background: #38bdf8;
            border: none;
            border-radius: 4px;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>PRACTICAL NO. 11</h1>
            <h3>HTML5 API DEMONSTRATION</h3>
        </header>

        <div class="api-section">
            <h2>1. Drag & Drop API</h2>
            <center>
                <div id="drag-item" draggable="true">📦</div>
            </center>
            <div class="drop-zone">
                Move package to this zone
            </div>
        </div>

        <div class="api-section">
            <h2>2. Geolocation API</h2>
            <div class="geo-box">
                <div class="dot"></div>
                <code>Searching: 21.14° N, 79.08° E</code>
            </div>
            <p style="font-size: 0.8rem; color: #64748b; margin-top: 5px;">
                Status: Signal tracking active (Nagpur Hub)
            </p>
        </div>

        <div class="api-section">
            <h2>3. Web Storage API</h2>
            <div style="display: flex; gap: 5px;">
                <input type="text" placeholder="Session ID...">
                <button type="button">SAVE</button>
            </div>
            <p style="font-size: 0.8rem; color: #64748b; margin-top: 5px;">
                Data will be stored in <b>localStorage</b>.
            </p>
        </div>

    </div>

</body>
</html>
