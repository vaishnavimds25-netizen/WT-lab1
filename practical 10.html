<!DOCTYPE html>
<html>
<head>
    <title>IFrame Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: #4a6ee0;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .container {
            padding: 20px;
        }

        .box {
            background-color: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        iframe {
            width: 100%;
            height: 300px;
            border: 2px solid #ccc;
            border-radius: 5px;
        }

        footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
        }

        @media screen and (max-width: 600px) {
            iframe {
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>HTML IFrame Demo</h1>
        <p>Embedding Maps and External Webpages</p>
    </header>

    <div class="container">

        <div class="box">
            <h2>Google Map</h2>

            <iframe 
                src="https://maps.google.com/maps?q=Nagpur&t=&z=13&ie=UTF8&iwloc=&output=embed">
            </iframe>
        </div>

        <div class="box">
            <h2>Embedded Website</h2>

            <iframe src="https://www.wikipedia.org"></iframe>
        </div>

    </div>

    <footer>
        <p>Created by Student | HTML IFrame Project</p>
    </footer>

</body>
</html>
